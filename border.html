<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>crossing</title>
  <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #1a1a1a; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .bright-rectangle {
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 0 50px #ffffff; 
            
            /* Combined animation shorthand syntax: */
            /* name | duration | timing-function | delay | fill-mode */
            animation: slowShrink 10s linear 3s forwards;
        }

        @keyframes slowShrink {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            95% {
                opacity: 1; 
            }
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="bright-rectangle" id="animatedRect"></div>

    <script>
        const rect = document.getElementById('animatedRect');
        
        // This still waits until the animation completely finishes (3s delay + 10s shrink)
        rect.addEventListener('animationend', () => {
            window.location.href = "https://www.yourworldoftext.com/~xpeachesx/AreaX";
        });
    </script>

</body>
</html>
